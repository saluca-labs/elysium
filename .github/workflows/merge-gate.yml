# Merge gate via salucallc/ci-shared (pinned by commit SHA; the same SHA in gate-ref).
# The standard: saluca-handoff KB/workflows/repo-merge-gate.md. Require 'gate / Merge gate all'.
name: merge-gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    uses: salucallc/ci-shared/.github/workflows/merge-gate.yml@6d16dbeed746754d12e8c77bdb7e24bf6753a799
    with:
      gate-ref: 6d16dbeed746754d12e8c77bdb7e24bf6753a799
